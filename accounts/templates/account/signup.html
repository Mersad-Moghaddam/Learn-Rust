{% extends "base.html" %}
{% load socialaccount %}
{% block content %}
<h1>ثبت‌نام</h1>
<form method="post" action="{% url 'account_signup' %}">
  {% csrf_token %}
  {{ form.as_p }}
  {{ redirect_field }}
  <button type="submit">ثبت‌نام</button>
</form>
<p><a href="{% url 'account_login' %}">ورود</a></p>
{% get_providers as providers %}
{% for provider in providers %}{% if provider.id == 'google' %}
<form method="post" action="{% provider_login_url provider %}">
  {% csrf_token %}
  <button type="submit">ثبت‌نام با گوگل</button>
</form>
{% endif %}{% endfor %}
{% endblock %}

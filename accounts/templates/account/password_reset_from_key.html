{% extends "base.html" %}
{% block content %}
<h1>انتخاب گذرواژه جدید</h1>
{% if token_fail %}<p>پیوند بازیابی نامعتبر یا منقضی است. <a href="{% url 'account_reset_password' %}">درخواست دوباره</a></p>
{% else %}<form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">تغییر گذرواژه</button></form>{% endif %}
{% endblock %}
